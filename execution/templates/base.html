<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aztec PM{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Aztec · Gestión de Proyectos</a>
    <nav class="topnav">
      <a href="{{ url_for('dashboard') }}">Vista operativa</a>
      <a href="{{ url_for('executive_dashboard') }}">Dashboard</a>
      <a href="{{ url_for('team_view') }}">Equipo</a>
      <a class="btn btn-primary" href="{{ url_for('project_new') }}">+ Nuevo proyecto</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
